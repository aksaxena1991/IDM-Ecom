services:
  postgres:
    build: .
    image: idm:16
    container_name: idm
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 1g
  redis-server:
    image: redis:latest
    container_name: idm-cache-redis-server
    ports:
      - "6379:6379"
    healthcheck:
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
      test: redis-server
    restart: unless-stopped
    volumes:
      - redis_data:/data
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: idm-pgadmin
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "5050:80"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - pgadmin_data:/var/lib/pgadmin
  mongodb:
    image: mongo:latest
    container_name: idm-mongodb
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    
volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  mongodb_data: