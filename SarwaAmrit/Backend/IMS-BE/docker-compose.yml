services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: product_catalog
      POSTGRES_PASSWORD: product_catalog_dev_password
      POSTGRES_DB: product_catalog
    ports:
      - "5435:5432"
    volumes:
      - ims_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_catalog -d product_catalog"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ims_postgres_data:
