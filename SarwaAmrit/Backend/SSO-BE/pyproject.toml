[project]
name = "sso-be"
version = "0.1.0"
description = "SarwaAmrit SSO backend — OIDC, SAML, SCIM, MFA, RBAC/ABAC/PBAC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pydantic-settings==2.7.0",
    "redis==5.2.1",
    "argon2-cffi==23.1.0",
    "cryptography==44.0.0",
    "PyJWT[crypto]==2.10.1",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    "email-validator==2.2.0",
    "lxml==5.3.0",
    "signxml==4.0.3",
    "pyotp==2.9.0",
    "qrcode==8.0",
    "greenlet==3.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "aiosqlite==0.20.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
